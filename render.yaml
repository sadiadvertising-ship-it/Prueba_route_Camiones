services:
  - type: web
    name: truck-route-planner-api
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    # Planning waits on routing and forecast calls, so threads serve more trips per
    # worker, and each worker's cache keeps repeated trips off the upstream services.
    startCommand: gunicorn config.wsgi:application --workers 2 --threads 4
    healthCheckPath: /api/health/
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.13
      - key: DJANGO_DEBUG
        value: "0"
      - key: DJANGO_SECRET_KEY
        generateValue: true
      # The key is typed into the Render dashboard, never into the repository.
      - key: ORS_API_KEY
        sync: false
      - key: CORS_ALLOWED_ORIGINS
        value: https://truck-route-planner-gamma.vercel.app
